[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soif"
version = "0.1.0"
description = "Estimate the water footprint of LLM prompts, the way you estimate their cost."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Erwin Lejeune", email = "erwin.lejeune15@gmail.com" }]
keywords = [
    "llm",
    "water",
    "sustainability",
    "environment",
    "footprint",
    "wue",
    "green-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
tokenizers = ["tiktoken>=0.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Unchained-Labs/soif"
Repository = "https://github.com/Unchained-Labs/soif"
Issues = "https://github.com/Unchained-Labs/soif/issues"

[project.scripts]
soif = "soif.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soif"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
