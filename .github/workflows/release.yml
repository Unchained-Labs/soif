name: Release to PyPI

# Publishes soif-llm to PyPI via Trusted Publishing (OIDC, no API tokens).
# One-time setup on pypi.org: add a "pending publisher" for project
# `soif-llm`, owner `Unchained-Labs`, repo `soif`, workflow `release.yml`,
# environment `pypi`. Then: create a GitHub release (or push a tag `v*`).

on:
  release:
    types: [published]
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag and the package version must agree
        # v1.0.0 was tagged while the package still said 0.1.0, so the release
        # went to PyPI under the old number and the tag has disagreed with the
        # artifact ever since. Cheap to check, and impossible to notice by eye.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $pkg"
            exit 1
          fi
          echo "ok  tag $tag matches package $pkg"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  factors:
    # Publish factors.json as a release asset so downstream consumers can pin a
    # factor set by URL rather than vendoring a copy that silently ages.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e "."
      - name: Regenerate and verify
        run: python scripts/export_factors.py --check
      - name: Attach factors.json to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" factors.json --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/soif-llm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
